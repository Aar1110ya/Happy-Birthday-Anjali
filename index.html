<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Anjali 🎀</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(180deg,#ffd6eb,#ffeef7);
  overflow-x: hidden;
}

/* BACKGROUND BOWS */
body::before {
  content: "🎀 🎀 🎀 🎀 🎀 🎀 🎀 🎀 🎀 🎀";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  font-size: 60px;
  opacity: 0.08;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  align-items: center;
  pointer-events: none;
}

/* HERO */
h1 {
  text-align: center;
  font-family: 'Pacifico', cursive;
  font-size: 3.5rem;
  margin: 60px 20px 20px;
  color: #ff4f9a;
  text-shadow: 0 0 15px #ffc1dc;
}

/* SLIDESHOW */
#slideshow {
  text-align: center;
  margin: 40px 0 80px;
}

#slideshow h2 {
  margin-bottom: 20px;
}

#slide {
  width: 320px;
  max-width: 85%;
  border-radius: 25px;
  box-shadow: 0 0 30px rgba(255,105,180,0.6);
  transition: opacity 0.8s;
}

/* FLOATING BOWS */
.bow {
  position: fixed;
  font-size: 30px;
  animation: float 12s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  from { transform: translateY(110vh); }
  to { transform: translateY(-10vh); }
}

/* GLITTER CURSOR */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: radial-gradient(circle,#fff,#ff69b4);
  border-radius: 50%;
  pointer-events: none;
  animation: sparkle 1s forwards;
}

@keyframes sparkle {
  to {
    opacity: 0;
    transform: scale(4);
  }
}
</style>
</head>

<body>

<h1>🎀 Happy Birthday Anjali 🎀</h1>

<section id="slideshow">
  <h2>✨ The Prettiest Girl in the World ✨</h2>
  <img id="slide" src="photos/p1.jpg">
</section>

<!-- BACKGROUND MUSIC -->
<audio id="bgm" autoplay muted loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* PHOTO SLIDESHOW */
const images = [
  "photos/p1.jpg",
  "photos/p2.jpg",
  "photos/p3.jpg",
  "photos/p4.jpg",
  "photos/p5.jpg",
  "photos/p6.jpg"
];

let index = 0;
const slide = document.getElementById("slide");

setInterval(() => {
  slide.style.opacity = 0;
  setTimeout(() => {
    index = (index + 1) % images.length;
    slide.src = images[index];
    slide.style.opacity = 1;
  }, 400);
}, 2500);

/* AUTOPLAY SOUND (Browser safe) */
const music = document.getElementById("bgm");
["click","scroll","mousemove","touchstart"].forEach(evt => {
  document.addEventListener(evt, () => {
    music.muted = false;
    music.play();
  }, { once: true });
});

/* GLITTER CURSOR */
document.addEventListener("mousemove", e => {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = e.clientX + "px";
  s.style.top = e.clientY + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1000);
});

/* FLOATING BOWS GENERATOR */
for(let i=0;i<15;i++){
  const b = document.createElement("div");
  b.className = "bow";
  b.innerHTML = "🎀";
  b.style.left = Math.random()*100 + "vw";
  b.style.animationDuration = 8 + Math.random()*10 + "s";
  document.body.appendChild(b);
}
</script>

</body>
</html>
