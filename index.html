<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Anjali 🎀</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  background:
    url("bow.png") repeat,
    linear-gradient(135deg,#ffd1e8,#ffe6f2);
  background-size: 120px, cover;
  min-height:100vh;
  overflow-x:hidden;
}

/* glitter cursor */
.glitter{
  position:fixed;
  width:6px;
  height:6px;
  background: radial-gradient(circle,#fff,#ff69b4);
  border-radius:50%;
  pointer-events:none;
  animation: sparkle 0.8s linear forwards;
  z-index:9999;
}

@keyframes sparkle{
  to{
    transform: scale(0);
    opacity:0;
  }
}

/* hero */
.hero{
  text-align:center;
  padding:100px 20px 60px;
}

.hero h1{
  font-size:3rem;
  color:#ff2f92;
}

.hero p{
  margin-top:10px;
  color:#444;
  font-size:1.1rem;
}

.btn{
  margin-top:30px;
  padding:14px 28px;
  background:#ff69b4;
  border:none;
  color:white;
  border-radius:30px;
  font-size:1rem;
  cursor:pointer;
}

/* slideshow */
.slideshow{
  width:320px;
  height:420px;
  margin:60px auto;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(255,105,180,0.4);
}

.slideshow img{
  width:100%;
  height:100%;
  object-fit:cover;
  animation: fade 1s ease-in-out;
}

@keyframes fade{
  from{opacity:0;}
  to{opacity:1;}
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:#fff0f6;
  padding:30px;
  border-radius:20px;
  max-width:400px;
  text-align:center;
}

.modal-content h2{
  color:#ff2f92;
}

.modal-content p{
  margin-top:15px;
  color:#444;
}

.close{
  margin-top:20px;
  background:#ff69b4;
  color:white;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- background music -->
<audio id="bgm" autoplay loop muted>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="hero">
  <h1>🎀 Happy Birthday Anjali 🎀</h1>
  <p>The prettiest girl in the world ✨</p>
  <button class="btn" onclick="openLetter()">💌 Open Letter</button>
</div>

<div class="slideshow">
  <img id="slide" src="p1.jpeg">
</div>

<!-- letter -->
<div class="modal" id="letter">
  <div class="modal-content">
    <h2>Dear Anjali 💖</h2>
    <p>
      You are grace, softness and strength wrapped into one.
      I hope this year gives you love, peace, laughter and
      everything beautiful you deserve 💕
    </p>
    <button class="close" onclick="closeLetter()">Close</button>
  </div>
</div>

<script>
/* autoplay fix */
window.addEventListener("click",()=>{
  const music=document.getElementById("bgm");
  music.muted=false;
  music.play();
},{once:true});

/* slideshow */
const images=["p1.jpeg","p2.jpeg","p3.jpeg","p4.jpeg","p5.jpeg","p6.jpeg","p7.jpeg"];
let i=0;
setInterval(()=>{
  i=(i+1)%images.length;
  document.getElementById("slide").src=images[i];
},3000);

/* modal */
function openLetter(){
  document.getElementById("letter").style.display="flex";
}
function closeLetter(){
  document.getElementById("letter").style.display="none";
}

/* glitter cursor */
document.addEventListener("mousemove",e=>{
  const g=document.createElement("div");
  g.className="glitter";
  g.style.left=e.clientX+"px";
  g.style.top=e.clientY+"px";
  document.body.appendChild(g);
  setTimeout(()=>g.remove(),800);
});

/* confetti */
for(let i=0;i<80;i++){
  const c=document.createElement("div");
  c.style.position="fixed";
  c.style.left=Math.random()*100+"vw";
  c.style.top="-10px";
  c.style.width="8px";
  c.style.height="8px";
  c.style.background="#ff69b4";
  c.style.borderRadius="50%";
  c.style.animation=`fall ${3+Math.random()*3}s linear infinite`;
  document.body.appendChild(c);
}

const style=document.createElement("style");
style.innerHTML=`
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}`;
document.head.appendChild(style);
</script>

</body>
</html>
